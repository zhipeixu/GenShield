# Configuration for Stage 2 training - Combined Tasks
# Task 1: Correction Stage 2 Initial    - anomalous image -> defect text + repaired image (CE + MSE)
# Task 2: Correction Stage 2 Terminate  - normal image    -> "no anomaly" text + same image (CE + MSE)
# Task 3: Correction Stage 2 Intermediate - half-repaired -> fully-repaired image (MSE on image; text allowed without loss)
# Task 4: AIGI Detection                - structured detection annotations (CE loss only)


# ============ Task 1: Correction Stage 2 — Initial step (anomalous samples) ============
# Input:  image + system prompt (fixed)
# Output: text (CE loss) + repaired image (MSE loss)
correction_stage2_initial:
  dataset_names:
  - synthscars
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 42
  num_used_data:
  - 11184
  weight: 1


# ============ Task 2: Correction Stage 2 — Termination step (normal samples) ============
# Input:  normal image + system prompt
# Output: "no anomaly" text (CE loss) + same image (MSE loss)
correction_stage2_terminate:
  dataset_names:
  - synthscars_normal
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: false
  shuffle_lines: true
  shuffle_seed: 42
  num_used_data:
  - 5000
  weight: 0.1


# ============ Task 3: Correction Stage 2 — Intermediate step (curriculum) ============
# Input:  half-repaired image (before_edit) + system prompt
# Output: text (no CE loss, just allowed) + fully-repaired image (MSE loss on after_edit)
correction_stage2_intermediate:
  dataset_names:
  - synthscars_half_to_one
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 42
  num_used_data:
  - 9355
  weight: 1


# ============ Task 4: AIGI Detection ============
# Input:  system prompt + image (ViT) + query
# Output: detection result + analysis (CE loss only, no image generation)
aigi_detection:
  dataset_names:
  - aigi_holmes
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 42
  num_used_data:
  - 64997
  weight: 1
